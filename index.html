<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      text-align: center;
    }

    header {
      padding: 16px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 20px auto;
    }

    #estado {
      margin: 15px;
      font-weight: bold;
    }

    #checkinFrame {
      width: 100%;
      height: 420px;
      border: none;
      background: white;
      display: none;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>

<body>

<header>
  <h2>Check-in</h2>
  <div id="estado">Presiona iniciar cámara</div>

  <button id="btnIniciar" onclick="iniciarScanner()">
    Iniciar cámara
  </button>
</header>

<div id="reader"></div>

<iframe
  id="checkinFrame"
  allow="camera"
></iframe>

<script>

const html5QrCode = new Html5Qrcode("reader");

let scannerActivo = false;
let ultimoCodigo = "";
let ultimoEscaneo = 0;


async function iniciarScanner() {

  if (scannerActivo) return;

  try {

    await html5QrCode.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const lado =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.7
            );

          return {
            width: lado,
            height: lado
          };
        }
      },

      codigoDetectado,

      function(error) {
        // Ignorar intentos donde no encuentra QR
      }
    );

    scannerActivo = true;

    document.getElementById("estado").innerText =
      "Escanea un pase";

    document.getElementById("btnIniciar").style.display =
      "none";


  } catch (error) {

    document.getElementById("estado").innerText =
      "No se pudo abrir la cámara.";

    console.error(error);
  }
}


async function codigoDetectado(decodedText) {

  const ahora = Date.now();

  // Evita leer el mismo QR muchas veces seguidas
  if (
    decodedText === ultimoCodigo &&
    ahora - ultimoEscaneo < 3000
  ) {
    return;
  }

  ultimoCodigo = decodedText;
  ultimoEscaneo = ahora;


  // Solo aceptar nuestros QR de check-in
  if (!decodedText.includes("modo=checkin")) {

    document.getElementById("estado").innerText =
      "Este QR no pertenece al sistema.";

    return;
  }


  try {

    await html5QrCode.pause(true);

  } catch (e) {}


  document.getElementById("estado").innerText =
    "Pase detectado";


  const frame =
    document.getElementById("checkinFrame");

  frame.src = decodedText;
  frame.style.display = "block";
}


window.addEventListener(
  "message",
  function(event) {

    if (
      event.data &&
      event.data.tipo === "checkinCompleto"
    ) {

      siguienteInvitado();

    }
  }
);


async function siguienteInvitado() {

  document.getElementById("checkinFrame").style.display =
    "none";

  document.getElementById("checkinFrame").src = "";

  ultimoCodigo = "";

  document.getElementById("estado").innerText =
    "Escanea el siguiente pase";


  try {

    html5QrCode.resume();

  } catch (e) {
    console.error(e);
  }
}

</script>

</body>
</html>
