<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      text-align: center;
    }

    header {
      padding: 16px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 20px auto;
    }

    #estado {
      margin: 15px;
      font-weight: bold;
    }

    #checkinFrame {
      width: 100%;
      height: 420px;
      border: none;
      background: white;
      display: none;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin: 10px;
    }
    #claveScanner {
  width: 90%;
  max-width: 350px;
  box-sizing: border-box;
  padding: 12px;
  font-size: 16px;
  margin: 8px;
}
  </style>
</head>

<body>

<header>
 <h2>Check-in</h2>

<div id="configScanner">

  <input
    type="password"
    id="claveScanner"
    placeholder="Clave de recepción"
  >

  <button onclick="guardarClaveEIniciar()">
    Iniciar check-in
  </button>

</div>

<div id="estado">
  Ingresa la clave para comenzar
</div>
</header>

<div id="reader"></div>

<iframe
  id="checkinFrame"
  allow="camera"
></iframe>

<script>

const html5QrCode = new Html5Qrcode("reader");

let scannerActivo = false;
let ultimoCodigo = "";
let ultimoEscaneo = 0;


async function iniciarScanner() {

  if (scannerActivo) return;

  try {

    await html5QrCode.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const lado =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.7
            );

          return {
            width: lado,
            height: lado
          };
        }
      },

      codigoDetectado,

      function(error) {
        // Ignorar intentos donde no encuentra QR
      }
    );

    scannerActivo = true;

    document.getElementById("estado").innerText =
      "Escanea un pase";

    document.getElementById("btnIniciar").style.display =
      "none";


  } catch (error) {

    document.getElementById("estado").innerText =
      "No se pudo abrir la cámara.";

    console.error(error);
  }
}


async function codigoDetectado(decodedText) {

  const ahora = Date.now();

  // Evita leer el mismo QR muchas veces seguidas
  if (
    decodedText === ultimoCodigo &&
    ahora - ultimoEscaneo < 3000
  ) {
    return;
  }

  ultimoCodigo = decodedText;
  ultimoEscaneo = ahora;


  // Solo aceptar nuestros QR de check-in
  if (!decodedText.includes("modo=checkin")) {

    document.getElementById("estado").innerText =
      "Este QR no pertenece al sistema.";

    return;
  }


  try {
  await html5QrCode.pause(true);
} catch (e) {}


// Ocultar completamente la cámara pausada
document.getElementById("reader").style.display = "none";

document.getElementById("estado").innerText =
  "Pase detectado";


const frame =
  document.getElementById("checkinFrame");

frame.src = decodedText;
frame.style.display = "block";
  frame.onload = function() {

  const claveGuardada =
    localStorage.getItem("claveCheckin") || "";

  frame.contentWindow.postMessage(
    {
      tipo: "claveCheckin",
      clave: claveGuardada
    },
    "*"
  );
};


// Llevar automáticamente a la ficha
frame.scrollIntoView({
  behavior: "smooth",
  block: "start"
});
}


window.addEventListener(
  "message",
  function(event) {

    if (
      event.data &&
      event.data.tipo === "checkinCompleto"
    ) {

      siguienteInvitado();

    }
  }
);


async function siguienteInvitado() {

  const frame =
    document.getElementById("checkinFrame");

  frame.style.display = "none";
  frame.src = "";

  ultimoCodigo = "";

  document.getElementById("estado").innerText =
    "Escanea el siguiente pase";


  // Volver a mostrar la cámara
  document.getElementById("reader").style.display = "block";


  try {
    html5QrCode.resume();
  } catch (e) {
    console.error(e);
  }


  // Regresar automáticamente a la cámara
  document.getElementById("reader").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}
function guardarClaveEIniciar() {

  const clave =
    document.getElementById("claveScanner").value.trim();

  if (!clave) {

    document.getElementById("estado").innerText =
      "Ingresa la clave de recepción.";

    return;
  }

  localStorage.setItem(
    "claveCheckin",
    clave
  );

  document.getElementById("configScanner").style.display =
    "none";

  iniciarScanner();
}
window.addEventListener("load", function() {

  const claveGuardada =
    localStorage.getItem("claveCheckin");

  if (claveGuardada) {

    document.getElementById("claveScanner").value =
      claveGuardada;

    document.getElementById("configScanner").style.display =
      "none";

    iniciarScanner();
  }
});  
</script>

</body>
</html>
