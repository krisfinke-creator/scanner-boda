  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;margin:0;background:#f6f4f1;color:#302d2a;text-align:center}
    header{padding:22px 16px 16px;background:#fff;border-bottom:1px solid #e8e3dc}
    header h2{margin:0 0 8px;font-size:24px}
    #infoEvento h3{margin:8px 0 4px;font-size:19px}
    #fechaEvento,#lugarEvento{font-size:14px;color:#716b64;line-height:1.45}
    #estado{margin:14px auto 0;font-weight:700;color:#4a4540;max-width:520px}
    #configScanner{margin-top:14px}
    #claveScanner{width:90%;max-width:350px;padding:12px 14px;font-size:16px;margin:6px;border:1px solid #d7d0c8;border-radius:10px;background:#fff}
    button{padding:12px 20px;font-size:16px;margin:8px;border:0;border-radius:10px;cursor:pointer}
    #configScanner button{background:#403a35;color:#fff;font-weight:700}

    /* Lector principal: siempre visible cuando html5-qrcode lo inicia. */
    #reader{width:calc(100% - 24px);max-width:520px;margin:22px auto 14px;background:#fff;border:1px solid #e8e3dc;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(46,40,32,.06)}
    #reader video{border-radius:14px}

    /* Alternativa manual: secundaria y debajo del lector. */
    #accionesRecepcion{display:none;width:calc(100% - 24px);max-width:520px;margin:0 auto 24px}
    .manual-card{background:#fff;border:1px solid #e8e3dc;border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px rgba(46,40,32,.04)}
    .manual-card .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#91897f;margin-bottom:6px;font-weight:700}
    .manual-card h4{margin:0 0 6px;font-size:17px;color:#403a35}
    .manual-card p{margin:0;font-size:14px;line-height:1.5;color:#6c665f}
    .manual-card .actions{margin-top:12px}
    .manual-card button{margin:0;background:#efe8df;color:#4b4136;border:1px solid #d8cabc;border-radius:999px;font-weight:700}

    /* Pantalla interna de resultado/búsqueda manual. */
    #checkinFrame{width:calc(100% - 24px);max-width:720px;height:520px;border:0;background:#fff;display:none;margin:18px auto 24px;border-radius:16px;box-shadow:0 8px 24px rgba(46,40,32,.06)}

    @media (max-width:600px){
      header{padding-top:18px}
      #reader{margin-top:16px}
      #checkinFrame{height:560px}
    }
  </style>
</head>
<body>
<header>
  <h2>Check-in</h2>
  <div
  id="infoEvento"
  style="display:none;"
>

  <h3 id="nombreEvento"></h3>

  <div id="fechaEvento"></div>

  <div id="lugarEvento"></div>

</div>
  <div id="configScanner">
    <input type="password" id="claveScanner" placeholder="Clave de recepción">
    <button onclick="guardarClaveEIniciar()">Iniciar check-in</button>
  </div>
  <div id="estado">Ingresa la clave para comenzar</div>
</header>

<div id="reader"></div>

<div id="accionesRecepcion">
  <div class="manual-card">
    <div class="eyebrow">Alternativa al QR</div>
    <h4>¿No puedes escanear el código?</h4>
    <p>Busca al invitado por nombre o invitación y registra su entrada manualmente.</p>
    <div class="actions">
      <button id="btnBusquedaManual" type="button" onclick="abrirBusquedaManual()">
        Buscar invitado manualmente
      </button>
    </div>
  </div>
</div>

<iframe id="checkinFrame" allow="camera"></iframe>
<iframe id="validadorFrame" name="validadorFrame" style="display:none;"></iframe>

  <form
  id="formEvento"
  method="post"
  target="validadorFrame"
  style="display:none;"
>

  <input
    type="hidden"
    name="accion"
    value="validarEventoScanner"
  >

  <input
    type="hidden"
    name="evento"
    id="eventoInicial"
  >

  <input
    type="hidden"
    name="canal"
    id="canalEvento"
  >

</form>
  
<form id="formValidador" method="post" target="validadorFrame" style="display:none;">
  <input type="hidden" name="accion" value="validarClaveCheckin">
  <input type="hidden" name="evento" id="eventoValidador">
  <input type="hidden" name="clave" id="claveValidador">
  <input type="hidden" name="canal" id="canalValidador">
</form>

<script>
const html5QrCode = new Html5Qrcode("reader");

const parametros = new URLSearchParams(window.location.search);
const EVENT_ID = String(parametros.get("evento") || "").trim().toLowerCase();

const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwRHyoh8FE4aA9DyDJa3RhyFAMlNpR6_Q5_UgC6JFma_zPdpBrwmqsthVZdvgekPNmV/exec";
const BACKEND_QR_URL = new URL(BACKEND_URL);

function crearCanalSeguro() {
  if (window.crypto && typeof window.crypto.randomUUID === "function") {
    return window.crypto.randomUUID();
  }

  if (window.crypto && typeof window.crypto.getRandomValues === "function") {
    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    return Array.from(bytes)
      .map(function(b) { return b.toString(16).padStart(2, "0"); })
      .join("");
  }

  return (
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2) +
    Math.random().toString(36).slice(2)
  );
}

const CANAL_SCANNER = crearCanalSeguro();

let scannerActivo = false;
let scannerIniciando = false;
let ultimoCodigo = "";
let ultimoEscaneo = 0;
let clavePendienteValidacion = "";

const SESION_STORAGE = "sesionCheckin_" + EVENT_ID;
const EXPIRA_STORAGE = "sesionCheckinExpira_" + EVENT_ID;

function mostrarAccionesRecepcion(modo) {
  const contenedor = document.getElementById("accionesRecepcion");
  if (!contenedor) return;

  /*
    La alternativa manual solo aparece mientras el lector QR está activo.
    Al abrir la búsqueda manual se oculta por completo para no duplicar
    los controles propios de CheckinManual.
  */
  contenedor.style.display =
    modo === "scanner"
      ? "block"
      : "none";
}

async function abrirBusquedaManual() {
  const sesion = localStorage.getItem(SESION_STORAGE) || "";
  const expira = Number(localStorage.getItem(EXPIRA_STORAGE) || 0);

  if (!sesion || expira <= Date.now()) {
    localStorage.removeItem(SESION_STORAGE);
    localStorage.removeItem(EXPIRA_STORAGE);

    mostrarAccionesRecepcion("oculto");

    document.getElementById("estado").innerText =
      "La sesión de recepción terminó. Ingresa nuevamente la contraseña.";

    document.getElementById("configScanner").style.display = "block";
    document.getElementById("reader").style.display = "block";
    mostrarAccionesRecepcion("oculto");

    try { html5QrCode.resume(); } catch (error) {}
    return;
  }

  try { await html5QrCode.pause(true); } catch (error) {}

  document.getElementById("reader").style.display = "none";
  document.getElementById("estado").innerText = "Búsqueda manual de invitados";

  const urlManual = new URL(BACKEND_URL);
  urlManual.searchParams.set("modo", "checkinmanual");
  urlManual.searchParams.set("evento", EVENT_ID);
  urlManual.searchParams.set("sesion", sesion);
  urlManual.searchParams.set("canal", CANAL_SCANNER);

  const frame = document.getElementById("checkinFrame");
  frame.src = urlManual.toString();
  frame.style.display = "block";

  mostrarAccionesRecepcion("manual");

  frame.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function validarEventoInicial() {

  if (!EVENT_ID) {

    document
      .getElementById(
        "configScanner"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "infoEvento"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "estado"
      )
      .innerText =
      "No se indicó el evento.";

    mostrarAccionesRecepcion("oculto");

    return;
  }


  document
    .getElementById(
      "configScanner"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "estado"
    )
    .innerText =
    "Verificando evento...";

  mostrarAccionesRecepcion("oculto");

  document
    .getElementById(
      "eventoInicial"
    )
    .value =
    EVENT_ID;

  document
    .getElementById(
      "canalEvento"
    )
    .value =
    CANAL_SCANNER;


  const formulario =
    document.getElementById(
      "formEvento"
    );


  formulario.action =
    BACKEND_URL;


  formulario.submit();
}
  
async function iniciarScanner() {
  if (scannerActivo || scannerIniciando) return;
  scannerIniciando = true;

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.7);
          return { width: lado, height: lado };
        }
      },
      codigoDetectado,
      function() {}
    );

    scannerActivo = true;
    scannerIniciando = false;
    document.getElementById("estado").innerText = "Escanea un pase";
    mostrarAccionesRecepcion("scanner");
  } catch (error) {
    scannerIniciando = false;
    console.error("Error al iniciar cámara:", error);
    if (!scannerActivo) {
      document.getElementById("estado").innerText = "No se pudo abrir la cámara.";
    }
  }
}

async function codigoDetectado(decodedText) {
  const ahora = Date.now();

  if (decodedText === ultimoCodigo && ahora - ultimoEscaneo < 3000) return;

  ultimoCodigo = decodedText;
  ultimoEscaneo = ahora;

  let urlQR;

  try {
    urlQR = new URL(decodedText);
  } catch (error) {
    document.getElementById("estado").innerText = "El código QR no es válido.";
    return;
  }

  const mismaRutaBackend =
    urlQR.origin === BACKEND_QR_URL.origin &&
    urlQR.pathname.replace(/\/+$/, "") ===
      BACKEND_QR_URL.pathname.replace(/\/+$/, "");

  if (!mismaRutaBackend) {
    document.getElementById("estado").innerText =
      "Este QR no pertenece a este sistema.";
    return;
  }

  if (urlQR.searchParams.get("modo") !== "checkin") {
    document.getElementById("estado").innerText = "Este QR no pertenece al sistema.";
    return;
  }

  const eventoQR = String(urlQR.searchParams.get("evento") || "").trim().toLowerCase();

  if (!eventoQR || eventoQR !== EVENT_ID) {
    document.getElementById("estado").innerText = "Este pase pertenece a otro evento.";
    return;
  }

  try { await html5QrCode.pause(true); } catch (error) {}

  document.getElementById("reader").style.display = "none";
  document.getElementById("estado").innerText = "Pase detectado";
  mostrarAccionesRecepcion("oculto");

  const sesion = localStorage.getItem(SESION_STORAGE) || "";
  const expira = Number(localStorage.getItem(EXPIRA_STORAGE) || 0);

  if (!sesion || expira <= Date.now()) {
    localStorage.removeItem(SESION_STORAGE);
    localStorage.removeItem(EXPIRA_STORAGE);

    document.getElementById("estado").innerText =
      "La sesión de recepción terminó. Ingresa nuevamente la contraseña.";
    document.getElementById("configScanner").style.display = "block";
    document.getElementById("reader").style.display = "block";

    try { html5QrCode.resume(); } catch (error) {}
    return;
  }

  urlQR.searchParams.set("sesion", sesion);
  urlQR.searchParams.set("canal", CANAL_SCANNER);

  const frame = document.getElementById("checkinFrame");
  frame.src = urlQR.toString();
  frame.style.display = "block";
  frame.scrollIntoView({ behavior: "smooth", block: "start" });
}

window.addEventListener("message", function(event) {
  if (!event.data) return;

  const tipo = String(event.data.tipo || "");

  /*
    Apps Script puede envolver las páginas en iframes
    internos de googleusercontent, por lo que event.source
    no es estable. En su lugar usamos un canal aleatorio
    creado por esta pestaña del scanner y enviado al backend.
  */

  if (
    tipo === "resultadoEventoScanner" ||
    tipo === "resultadoClaveScanner" ||
    tipo === "checkinCompleto"
  ) {

    const canalMensaje =
      String(
        event.data.canal || ""
      );

    const eventoMensaje =
      String(
        event.data.evento || ""
      )
      .trim()
      .toLowerCase();

    if (
      !canalMensaje ||
      canalMensaje !== CANAL_SCANNER ||
      !eventoMensaje ||
      eventoMensaje !== EVENT_ID
    ) {
      return;
    }
  }


  if (
    tipo === "checkinCompleto"
  ) {

    siguienteInvitado();
    return;
  }


  if (
    tipo ===
    "resultadoEventoScanner"
  ) {

    if (
      !event.data.valido
    ) {

      localStorage.removeItem(
        SESION_STORAGE
      );

      localStorage.removeItem(
        EXPIRA_STORAGE
      );

      document
        .getElementById(
          "configScanner"
        )
        .style.display =
        "none";

      document
        .getElementById(
          "infoEvento"
        )
        .style.display =
        "none";

      document
        .getElementById(
          "estado"
        )
        .innerText =
        "Evento no válido o inactivo.";

      mostrarAccionesRecepcion("oculto");

      return;
    }


    document
      .getElementById(
        "nombreEvento"
      )
      .innerText =
      String(
        event.data.nombres || ""
      );

    document
      .getElementById(
        "fechaEvento"
      )
      .innerText =
      String(
        event.data.fecha || ""
      );

    document
      .getElementById(
        "lugarEvento"
      )
      .innerText =
      String(
        event.data.lugar || ""
      );

    document
      .getElementById(
        "infoEvento"
      )
      .style.display =
      "block";


    const sesion =
      localStorage.getItem(
        SESION_STORAGE
      );

    const expira =
      Number(
        localStorage.getItem(
          EXPIRA_STORAGE
        ) || 0
      );


    if (
      sesion &&
      expira > Date.now()
    ) {

      document
        .getElementById(
          "configScanner"
        )
        .style.display =
        "none";

      document
        .getElementById(
          "estado"
        )
        .innerText =
        "Abriendo scanner...";

      iniciarScanner();

    } else {

      localStorage.removeItem(
        SESION_STORAGE
      );

      localStorage.removeItem(
        EXPIRA_STORAGE
      );

      document
        .getElementById(
          "configScanner"
        )
        .style.display =
        "block";

      document
        .getElementById(
          "estado"
        )
        .innerText =
        "Ingresa la clave para comenzar.";

      mostrarAccionesRecepcion("oculto");
    }

    return;
  }


  if (
    tipo !==
    "resultadoClaveScanner"
  ) {
    return;
  }


  if (event.data.valida) {

    const tokenSesion =
      String(
        event.data.token || ""
      );

    const expiraSesion =
      Number(
        event.data.expira || 0
      );

    if (
      !tokenSesion ||
      !expiraSesion
    ) {

      document
        .getElementById(
          "estado"
        )
        .innerText =
        "No se pudo crear la sesión de recepción.";

      return;
    }

    localStorage.setItem(
      SESION_STORAGE,
      tokenSesion
    );

    localStorage.setItem(
      EXPIRA_STORAGE,
      String(
        expiraSesion
      )
    );

    localStorage.removeItem(
      "claveCheckin_" + EVENT_ID
    );

    clavePendienteValidacion = "";

    document
      .getElementById(
        "configScanner"
      )
      .style.display =
      "none";

    document
      .getElementById(
        "estado"
      )
      .innerText =
      "Contraseña correcta. Iniciando cámara...";

    iniciarScanner();

  } else {

    localStorage.removeItem(
      SESION_STORAGE
    );

    localStorage.removeItem(
      EXPIRA_STORAGE
    );

    clavePendienteValidacion = "";

    document
      .getElementById(
        "configScanner"
      )
      .style.display =
      "block";

    const campo =
      document.getElementById(
        "claveScanner"
      );

    campo.value = "";
    campo.focus();

    document
      .getElementById(
        "estado"
      )
      .innerText =
      "Contraseña incorrecta. Inténtalo de nuevo.";

    mostrarAccionesRecepcion("oculto");
  }
});

async function siguienteInvitado() {
  const frame = document.getElementById("checkinFrame");
  frame.style.display = "none";
  frame.src = "";
  ultimoCodigo = "";

  document.getElementById("estado").innerText = "Escanea el siguiente pase";
  document.getElementById("reader").style.display = "block";
  mostrarAccionesRecepcion("scanner");

  try { html5QrCode.resume(); } catch (error) { console.error(error); }

  document.getElementById("reader").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}

function validarClaveScanner(clave) {
  clavePendienteValidacion = String(clave || "").trim();

  if (!clavePendienteValidacion) {
    document.getElementById("estado").innerText =
      "Ingresa la contraseña de recepción.";
    return;
  }

  document.getElementById("estado").innerText = "Verificando contraseña...";

  const formulario = document.getElementById("formValidador");
  formulario.action = BACKEND_URL;
  document.getElementById("eventoValidador").value = EVENT_ID;
  document.getElementById("claveValidador").value = clavePendienteValidacion;
  document.getElementById("canalValidador").value = CANAL_SCANNER;
  formulario.submit();
}

function guardarClaveEIniciar() {
  if (!EVENT_ID) {
    document.getElementById("estado").innerText = "No se indicó el evento.";
    return;
  }

  const clave = document.getElementById("claveScanner").value.trim();
  validarClaveScanner(clave);
}


window.addEventListener(
  "load",
  function() {

    validarEventoInicial();

  }
);

</script>
</body>
</html>
