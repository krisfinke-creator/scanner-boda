<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="robots" content="noindex,nofollow">
  <title>Solteros</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    #estado {
      display: none;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 40px 22px;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #333;
      background: #fff;
    }

    #estado.visible {
      display: flex;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
    }
  </style>
</head>

<body>

  <div id="estado"></div>

  <iframe
    id="appFrame"
    title="Solteros"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbwRHyoh8FE4aA9DyDJa3RhyFAMlNpR6_Q5_UgC6JFma_zPdpBrwmqsthVZdvgekPNmV/exec";

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const EVENT_ID =
      String(
        parametros.get("evento") || ""
      )
      .trim()
      .toLowerCase();


    const frame =
      document.getElementById(
        "appFrame"
      );

    const estado =
      document.getElementById(
        "estado"
      );


    function mostrarError(mensaje) {
      frame.style.display = "none";
      estado.textContent = mensaje;
      estado.classList.add("visible");
    }


    function iniciar() {

      if (!EVENT_ID) {
        mostrarError(
          "No se indicó el evento."
        );
        return;
      }


      const url =
        new URL(
          BACKEND_URL
        );

      url.searchParams.set(
        "modo",
        "solteros"
      );

      url.searchParams.set(
        "evento",
        EVENT_ID
      );


      frame.src =
        url.toString();
    }


    iniciar();
  </script>

</body>
</html>
